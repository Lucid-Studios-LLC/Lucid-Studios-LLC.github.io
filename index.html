<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucid Studios</title>
<style>
:root { color-scheme: light dark; --page-background:#ffffff; --body-text:#1c1c1e; --muted-text:#52525b; --rule:#e4e4e7; --link:#0b6bcb; }
@media (prefers-color-scheme: dark) { :root { --page-background:#111214; --body-text:#e8e8ea; --muted-text:#a1a1aa; --rule:#2a2c30; --link:#7cb7ff; } }
body { margin:0 auto; max-width:44rem; padding:3rem 1.25rem; background:var(--page-background); color:var(--body-text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.65; }
h1 { font-size:1.9rem; margin:0 0 .25rem; }
h2 { font-size:1.15rem; margin:2rem 0 .5rem; }
p { color:var(--muted-text); margin:0 0 1rem; }
ul { padding-left:1.25rem; margin:0; }
li { margin-bottom:.4rem; }
a { color:var(--link); }
footer { border-top:1px solid var(--rule); margin-top:2.5rem; padding-top:1rem; color:var(--muted-text); font-size:.95rem; }
</style>
</head>
<body>
<header id="site-header">
  <h1 id="site-title">Lucid Studios</h1>
  <p id="site-tagline"></p>
</header>
<main id="site-main">
  <h2 id="fliklist-heading">fliklist</h2>
  <ul id="fliklist-links">
    <li id="fliklist-privacy-item"><a id="fliklist-privacy-link" href="/fliklist/privacy/">Privacy policy</a></li>
    <li id="fliklist-support-item"><a id="fliklist-support-link" href="/fliklist/support/">Support</a></li>
  </ul>

  <h2 id="jump-timer-heading">Jump Timer</h2>
  <ul id="jump-timer-links">
    <li id="jump-timer-privacy-item"><a id="jump-timer-privacy-link" href="/jump-timer/privacy/">Privacy policy</a></li>
    <li id="jump-timer-support-item"><a id="jump-timer-support-link" href="/jump-timer/support/">Support</a></li>
  </ul>
</main>
<footer id="site-footer">
  <p id="site-contact">Contact: <a id="site-contact-link" href="mailto:developer@lucidstudios.io">developer@lucidstudios.io</a></p>
</footer>
</body>
</html>
